name: Auto blog

on:
  schedule:
    # Every 10 minutes (UTC). GitHub may delay scheduled runs, and pauses
    # schedules after 60 days without repository activity.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: How many posts to publish this run
        required: false
        default: '1'
      lang:
        description: Which sources to use
        type: choice
        options:
          - all
          - fr
          - en
        default: all
      max_per_day:
        description: Hard cap of auto posts per 24 hours (0 = unlimited)
        required: false
        default: '6'
      draft:
        description: Publish as drafts instead of live posts
        type: boolean
        default: false
      dry_run:
        description: Only print what would be published
        type: boolean
        default: false
      max_age_hours:
        description: Ignore articles older than this many hours
        required: false
        default: '48'

permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  publish:
    name: Import feed articles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish blog posts
        run: >-
          node scripts/auto-blog.mjs
          --limit ${{ inputs.limit || '1' }}
          --lang ${{ inputs.lang || 'all' }}
          --max-per-day ${{ inputs.max_per_day || '6' }}
          --max-age-hours ${{ inputs.max_age_hours || '48' }}
          ${{ inputs.draft && '--draft' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_BLOG_HANDLE: ${{ vars.SHOPIFY_BLOG_HANDLE || 'news' }}
          SHOPIFY_BLOG_TITLE: ${{ vars.SHOPIFY_BLOG_TITLE || 'Nayro Blog' }}

      # GitHub disables scheduled workflows in repositories with no activity for
      # 60 days. Committing a timestamp every two weeks keeps the schedule alive
      # without needing anyone to touch the repository.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        run: |
          set -e
          file=.github/auto-blog-heartbeat
          last=0
          if [ -f "$file" ]; then last=$(cat "$file" || echo 0); fi
          now=$(date +%s)
          if [ "$last" -gt 0 ] && [ $((now - last)) -lt 1209600 ]; then
            echo "Heartbeat is recent, nothing to do."
            exit 0
          fi
          echo "$now" > "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "Keep the auto blog schedule alive"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
